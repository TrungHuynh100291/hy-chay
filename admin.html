<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB7CH4HUqEozclN38P_iGtSFzDB_w7sOUk",
      authDomain: "hy-chay.firebaseapp.com",
      projectId: "hy-chay",
      storageBucket: "hy-chay.firebasestorage.app",
      messagingSenderId: "215026977682",
      appId: "1:215026977682:web:52b136c7f09a62cc488f4b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app, "https://hy-chay-default-rtdb.asia-southeast1.firebasedatabase.app");

    let audioEnabled = false;
    window.enableAudio = function() {
      let sound = document.getElementById('alertSound');
      sound.play().then(() => {
        sound.pause();
        sound.currentTime = 0;
        audioEnabled = true;
        document.getElementById('soundControl').style.background = '#d1fae5';
        document.getElementById('soundControl').innerHTML = '✅ Âm thanh báo đơn đã sẵn sàng hoạt động!';
      }).catch(e => {
        alert("Vui lòng bấm lại hoặc kiểm tra cài đặt âm thanh trình duyệt.");
      });
    };

    const ordersRef = ref(db, 'orders');
    onValue(ordersRef, (snapshot) => {
      const data = snapshot.val();
      const container = document.getElementById('ordersContainer');
      const badge = document.getElementById('orderCountBadge');
      
      if (!data) {
        container.innerHTML = '<p style="color: #666; grid-column: 1/-1; text-align: center; padding: 40px;">Chưa có đơn hàng nào.</p>';
        badge.innerText = 'Đang chờ: 0 đơn';
        document.getElementById('alertSound').pause();
        return;
      }

      let html = '';
      let count = 0;
      let hasNewOrder = false;

      for (let id in data) {
        let order = data[id];
        count++;
        hasNewOrder = true;

        let itemsHtml = '';
        let totalPrice = 0;
        for (let key in order.items) {
          let i = order.items[key];
          let sub = i.price * i.qty;
          totalPrice += sub;
          itemsHtml += `<div><span>${i.name} (x${i.qty})</span><b>${sub.toLocaleString()}đ</b></div>`;
        }

        html += `
          <div class="order-card">
            <div class="order-header">
              <b>Khách: ${order.customerName}</b>
              <span class="order-time">${new Date(order.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
            </div>
            <div class="customer-info">
              <p>📞 SĐT: <a href="tel:${order.phone}" style="color: #2563eb; font-weight:bold;">${order.phone}</a></p>
              <p>📍 Địa chỉ: <b>${order.address}</b></p>
              ${order.note ? `<p>📝 Ghi chú: <span style="color:#e53e3e">${order.note}</span></p>` : ''}
            </div>
            <div class="items-list">${itemsHtml}</div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: bold; font-size: 1.05rem;">
              <span>Tổng tiền:</span>
              <span style="color: #e53e3e;">${totalPrice.toLocaleString()}đ</span>
            </div>
            <button class="btn-confirm" onclick="confirmOrder('${id}')">✓ ĐÃ XÁC NHẬN / IN ĐƠN</button>
          </div>
        `;
      }

      container.innerHTML = html;
      badge.innerText = `Đang chờ: ${count} đơn`;

      if (hasNewOrder && audioEnabled) {
        let sound = document.getElementById('alertSound');
        if (sound.paused) {
          sound.play().catch(err => console.log("Chờ tương tác bật âm thanh"));
        }
      }
    });

    window.confirmOrder = function(orderId) {
      if (confirm("Xác nhận đã tiếp nhận và xử lý đơn này? Chuông báo sẽ ngưng.")) {
        document.getElementById('alertSound').pause();
        document.getElementById('alertSound').currentTime = 0;
        remove(ref(db, 'orders/' + orderId));
      }
    };
  </script>
