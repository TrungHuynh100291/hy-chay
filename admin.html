<!-- SCRIPT FIREBASE TỰ ĐỘNG ĐỒNG BỘ TRẠNG THÁI HẾT MÓN & GIỎ HÀNG -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB7CH4HUqEozclN38P_iGtSFzDB_w7sOUk",
      authDomain: "hy-chay.firebaseapp.com",
      projectId: "hy-chay",
      storageBucket: "hy-chay.firebasestorage.app",
      messagingSenderId: "215026977682",
      appId: "1:215026977682:web:52b136c7f09a62cc488f4b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app, "https://hy-chay-default-rtdb.asia-southeast1.firebasedatabase.app");

    // BẢNG MÃ MÓN ĐỂ ĐỒNG BỘ VỚI ADMIN
    const dishKeyMap = {
      "bunchagio": "Bún Chả Giò Chay",
      "banhcanh": "Bánh Canh Chay",
      "hoanhthanhmi": "Mì Hoành Thánh Chay",
      "miquang": "Mì Quảng Chay",
      "comga": "Cơm Gà Chay",
      "xoi": "Xôi Thập Cẩm Chay",
      "nomhoachuoi": "Nộm Hoa Chuối Tri Kỷ",
      "mispaghetti": "Mì Ý Sốt Bò Bằm Chay"
    };

    let soldOutItems = {};

    // LẮNG NGHE TÌNH TRẠNG KHO MÓN TỪ ADMIN
    onValue(ref(db, 'menu_status'), (snapshot) => {
      const statusData = snapshot.val() || {};
      soldOutItems = {};

      for (let id in dishKeyMap) {
        const dishName = dishKeyMap[id];
        const isSoldOut = statusData[id] && statusData[id].soldOut;
        soldOutItems[dishName] = isSoldOut;

        // Cập nhật giao diện nút bấm tương ứng
        document.querySelectorAll('.dish-card').forEach(card => {
          const title = card.querySelector('h3').innerText.trim();
          if (title === dishName) {
            const btn = card.querySelector('.btn-add-cart');
            if (isSoldOut) {
              btn.innerText = "TẠM HẾT MÓN";
              btn.style.background = "#9ca3af";
              btn.disabled = true;
              card.style.opacity = "0.65";
            } else {
              btn.innerText = "+ Chọn Món";
              btn.style.background = "var(--primary)";
              btn.disabled = false;
              card.style.opacity = "1";
            }
          }
        });
      }
    });

    let cart = {};

    window.addToCart = function(name, price) {
      if (soldOutItems[name]) {
        alert("Rất tiếc, món này hiện tại quán vừa tạm hết!");
        return;
      }
      if (cart[name]) {
        cart[name].qty += 1;
      } else {
        cart[name] = { name, price, qty: 1 };
      }
      updateCartUI();
      alert("Đã thêm " + name + " vào giỏ hàng!");
    };

    window.updateCartQty = function(name, delta) {
      if (cart[name]) {
        cart[name].qty += delta;
        if (cart[name].qty <= 0) delete cart[name];
      }
      updateCartUI();
      renderCartItems();
    };

    function updateCartUI() {
      let totalCount = 0;
      let totalPrice = 0;
      for (let key in cart) {
        totalCount += cart[key].qty;
        totalPrice += cart[key].price * cart[key].qty;
      }
      document.getElementById('cartCount').innerText = totalCount;
      document.getElementById('cartTotal').innerText = totalPrice.toLocaleString() + 'đ';
      
      const bar = document.getElementById('cartBar');
      if (totalCount > 0) {
        bar.classList.add('active');
      } else {
        bar.classList.remove('active');
        closeCheckoutModal();
      }
    }

    window.openCheckoutModal = function() {
      renderCartItems();
      document.getElementById('checkoutModal').classList.add('active');
    };

    window.closeCheckoutModal = function() {
      document.getElementById('checkoutModal').classList.remove('active');
    };

    function renderCartItems() {
      let listDiv = document.getElementById('cartItemsList');
      let html = '';
      let totalPrice = 0;
      for (let key in cart) {
        let item = cart[key];
        let sub = item.price * item.qty;
        totalPrice += sub;
        html += `<div class="cart-item-row">
          <span><b>${item.name}</b> (${item.price.toLocaleString()}đ)</span>
          <div>
            <button type="button" onclick="updateCartQty('${item.name}', -1)" style="padding:2px 8px;">-</button>
            <span style="margin: 0 8px;">${item.qty}</span>
            <button type="button" onclick="updateCartQty('${item.name}', 1)" style="padding:2px 8px;">+</button>
            <b style="margin-left: 10px;">${sub.toLocaleString()}đ</b>
          </div>
        </div>`;
      }
      if (html === '') html = '<p>Giỏ hàng đang trống.</p>';
      else html += `<div style="text-align:right; font-weight:bold; margin-top:10px; font-size:1.1rem;">Tổng cộng: ${totalPrice.toLocaleString()}đ</div>`;
      listDiv.innerHTML = html;
    }

    window.submitOrder = function(e) {
      e.preventDefault();
      let name = document.getElementById('cusName').value;
      let phone = document.getElementById('cusPhone').value;
      let address = document.getElementById('cusAddress').value;
      let note = document.getElementById('cusNote').value;

      let orderData = {
        customerName: name,
        phone: phone,
        address: address,
        note: note,
        items: cart,
        status: 'Chờ xác nhận',
        createdAt: new Date().toISOString()
      };

      push(ref(db, 'orders'), orderData)
        .then(() => {
          alert("Gửi đơn hàng thành công! Quán sẽ gọi điện xác nhận ngay.");
          cart = {};
          updateCartUI();
          closeCheckoutModal();
          document.getElementById('orderForm').reset();
        })
        .catch((error) => {
          alert("Lỗi khi gửi đơn: " + error.message);
        });
    };
  </script>
