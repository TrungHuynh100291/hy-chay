name: Gemini AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gemini Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 - << 'EOF'
          import os
          import json
          import urllib.request
          import subprocess

          api_key = os.environ.get("GEMINI_API_KEY")
          pr_number = os.environ.get("PR_NUMBER")
          base_ref = os.environ.get("BASE_REF", "main")

          # 1. Lấy phần code thay đổi
          try:
              diff = subprocess.check_output(
                  ["git", "diff", f"origin/{base_ref}", "HEAD"]
              ).decode("utf-8", errors="ignore")
          except Exception:
              diff = subprocess.check_output(["git", "diff", "HEAD~1", "HEAD"]).decode("utf-8", errors="ignore")

          if not diff.strip():
              print("Không có thay đổi mã nguồn nào.")
              exit(0)

          if len(diff) > 25000:
              diff = diff[:25000] + "\n... (Diff quá dài, đã lược bớt)"

          # 2. Gửi yêu cầu phân tích tới Gemini 1.5 Flash
          prompt = f"""Bạn là chuyên gia phân tích mã nguồn. Hãy đánh giá các thay đổi sau:
          1. Tóm tắt ngắn gọn nội dung chỉnh sửa.
          2. Phát hiện lỗi tiềm ẩn (bugs), lỗ hổng bảo mật hoặc cấu trúc chưa tối ưu.
          3. Đề xuất cách khắc phục cụ thể bằng Tiếng Việt.

          Code Diff:
          ```diff
          {diff}
          ```
          """

          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}"
          payload = {"contents": [{"parts": [{"text": prompt}]}]}

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )

          with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read().decode("utf-8"))
              review_text = data["candidates"][0]["content"]["parts"][0]["text"]

          comment = f"### 🤖 Gemini AI Code Review\n\n{review_text}"
          with open("review.md", "w", encoding="utf-8") as f:
              f.write(comment)

          # 3. Đăng bình luận trực tiếp vào Pull Request
          subprocess.run(["gh", "pr", "comment", pr_number, "--body-file", "review.md"], check=True)
          print("Đã hoàn tất review code!")
          EOF
