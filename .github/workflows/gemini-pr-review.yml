name: Gemini AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gemini Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 - << 'EOF'
          import os
          import json
          import urllib.request
          import urllib.error
          import subprocess

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          pr_number = os.environ.get("PR_NUMBER")
          base_ref = os.environ.get("BASE_REF", "main")

          if not api_key:
              print("❌ LỖI: Chưa có GEMINI_API_KEY trong GitHub Secrets!")
              exit(1)

          # 1. Lấy phần code thay đổi
          try:
              diff = subprocess.check_output(
                  ["git", "diff", f"origin/{base_ref}", "HEAD"]
              ).decode("utf-8", errors="ignore")
          except Exception:
              diff = subprocess.check_output(["git", "diff", "HEAD~1", "HEAD"]).decode("utf-8", errors="ignore")

          if not diff.strip():
              print("ℹ️ Không có thay đổi mã nguồn nào cần review.")
              exit(0)

          if len(diff) > 20000:
              diff = diff[:20000] + "\n... (Diff quá dài, đã lược bớt)"

          # 2. Tự động dò danh sách model khả dụng trên tài khoản Google AI Studio
          candidate_models = ["models/gemini-2.5-flash", "models/gemini-2.0-flash"]
          try:
              list_url = f"https://generativelanguage.googleapis.com/v1beta/models?key={api_key}"
              with urllib.request.urlopen(list_url) as r:
                  models_data = json.loads(r.read().decode("utf-8"))
                  for m in models_data.get("models", []):
                      name = m.get("name", "")
                      methods = m.get("supportedGenerationMethods", [])
                      if "generateContent" in methods and "gemini" in name and name not in candidate_models:
                          candidate_models.append(name)
          except Exception as e:
              print(f"Cảnh báo khi lấy danh sách model: {e}")

          prompt = f"""Bạn là chuyên gia phân tích mã nguồn. Hãy đánh giá các thay đổi sau:
          1. Tóm tắt ngắn gọn nội dung chỉnh sửa.
          2. Phát hiện lỗi tiềm ẩn (bugs), bảo mật hoặc cấu trúc chưa tối ưu.
          3. Đề xuất cách khắc phục cụ thể bằng Tiếng Việt.

          Code Diff:
          ```diff
          {diff}
          ```
          """

          payload = {"contents": [{"parts": [{"text": prompt}]}]}
          review_text = None

          for model_path in candidate_models:
              url = f"https://generativelanguage.googleapis.com/v1beta/{model_path}:generateContent?key={api_key}"
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"}
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      review_text = data["candidates"][0]["content"]["parts"][0]["text"]
                      print(f"✅ Đã phân tích thành công bằng model: {model_path}")
                      break
              except urllib.error.HTTPError as e:
                  print(f"⚠️ Model {model_path} trả về mã {e.code}, đang thử model tiếp theo...")

          if not review_text:
              print("❌ LỖI: Không thể gọi Gemini API. Vui lòng kiểm tra lại GEMINI_API_KEY!")
              exit(1)

          comment = f"### 🤖 Gemini AI Code Review\n\n{review_text}"
          with open("review.md", "w", encoding="utf-8") as f:
              f.write(comment)

          # 3. Đăng bình luận trực tiếp vào Pull Request
          res = subprocess.run(["gh", "pr", "comment", str(pr_number), "--body-file", "review.md"], capture_output=True, text=True)
          if res.returncode != 0:
              print(f"❌ LỖI ĐĂNG BÌNH LUẬN: {res.stderr}")
              exit(1)

          print("🎉 Đã hoàn tất review và đăng nhận xét lên Pull Request!")
          EOF
