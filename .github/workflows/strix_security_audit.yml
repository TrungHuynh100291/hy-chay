name: Strix AI Pentest & API Shield Gate (BAL V6)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: strix-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-shield-owasp-htkk-gate:
    name: API Shield, OWASP Top 10 & HTKK Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout POS V39 Source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run BAL V6 API Shield, OWASP Top 10 & HTKK Audit
        env:
          BAL_RED_ALERT_WEBHOOK: https://ntfy.sh/bal_studio_colab_bridge_3401289271
        run: |
          python - <<'PYEOF'
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          import urllib.request

          errors = []
          red_alerts = []

          def mask_secret(val):
              s = str(val or "").strip()
              if len(s) <= 8:
                  return "***REDACTED***"
              return s[:4] + "..." + s[-2:] + " [REDACTED]"

          def is_firebase_client_context(lines, idx):
              lo = max(0, idx - 4)
              hi = min(len(lines), idx + 5)
              window = "\n".join(lines[lo:hi])
              is_firebase = ("firebaseConfig" in window or "hy-chay.firebaseapp.com" in window or "firebasedatabase.app" in window)
              is_gemini_context = ("GEMINI" in window.upper() or "GOOGLE_AI" in window.upper() or "generativelanguage" in window.lower())
              return is_firebase and not is_gemini_context

          def collect_repo_files():
              skip_dirs = {".git", "node_modules", "dist", ".codegraph", ".engram", ".vercel", "HyChay_Khach.apk", "HyChay_POS.apk", "HyChay_Shipper.apk"}
              skip_exts = {
                  ".png", ".jpg", ".jpeg", ".webp", ".gif", ".ico", ".svg",
                  ".mp4", ".mov", ".avi", ".pdf", ".zip", ".apk", ".woff", ".woff2", ".ttf", ".eot",
                  ".exe", ".dll", ".so", ".dylib", ".bin", ".lib", ".o", ".jar", ".dex", ".aar",
                  ".db", ".sqlite", ".rvf"
              }
              def should_skip(rel_path):
                  parts = rel_path.replace("\\", "/").split("/")
                  if any(p in skip_dirs for p in parts):
                      return True
                  if os.path.splitext(rel_path)[1].lower() in skip_exts:
                      return True
                  return False

              if os.path.isdir(".git"):
                  res = subprocess.run(["git", "-c", "core.quotePath=false", "ls-files"], capture_output=True, text=True)
                  if res.returncode == 0 and res.stdout.strip():
                      files = []
                      for rel in res.stdout.splitlines():
                          rel = rel.strip().strip('"')
                          if not rel or not os.path.isfile(rel) or should_skip(rel):
                              continue
                          files.append(rel)
                      return files
              files = []
              for dp, dns, fns in os.walk("."):
                  dns[:] = [d for d in dns if d not in skip_dirs]
                  for fn in fns:
                      if fn.startswith(".env"):
                          continue
                      rel = os.path.relpath(os.path.join(dp, fn), ".")
                      if should_skip(rel):
                          continue
                      files.append(rel)
              return files

          def run_api_shield_scan(files):
              api_rules = [
                  ("GEMINI_AQ_TOKEN", re.compile(r"\bAQ\.[0-9A-Za-z_-]{20,}")),
                  ("GEMINI_KEY_URL", re.compile(r"generativelanguage\.googleapis\.com[^\s\"'`<>]{0,160}\?key=[A-Za-z0-9_-]{16,}")),
                  ("GEMINI_ENV_HARDCODED", re.compile(r"(?:GEMINI_API_KEY|GOOGLE_API_KEY|GOOGLE_AI_KEY|GOOGLE_GENERATIVE_AI_API_KEY)\s*[:=]\s*[\"'][A-Za-z0-9._-]{16,}[\"']")),
                  ("VERCEL_TOKEN_PREFIX", re.compile(r"\b(?:vcp|vcl|vck)_[0-9A-Za-z]{20,}\b")),
                  ("VERCEL_ENV_HARDCODED", re.compile(r"(?:VERCEL_API_KEY|VERCEL_TOKEN|VERCEL_AUTH_TOKEN|VERCEL_ACCESS_TOKEN)\s*[:=]\s*[\"'][A-Za-z0-9._-]{16,}[\"']")),
                  ("HARDCODED_BEARER_TOKEN", re.compile(r"Authorization[\"']?\s*[:=]\s*[\"']Bearer\s+[A-Za-z0-9._-]{20,}[\"']")),
                  ("FACEBOOK_PAGE_TOKEN", re.compile(r"\bEAA[0-9A-Za-z]{40,}\b")),
                  ("PRIVATE_KEY_LEAK", re.compile(r"-----BEGIN (?:RSA|EC|OPENSSH|DSA) PRIVATE KEY-----")),
                  ("OPENAI_OR_SK_KEY", re.compile(r"\bsk-[A-Za-z0-9_-]{20,}")),
                  ("GITHUB_PAT_LEAK", re.compile(r"\bgh[pousr]_[A-Za-z0-9]{20,}")),
                  ("AWS_ACCESS_KEY", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ]
              aiza_pattern = re.compile(r"\bAIza[0-9A-Za-z_-]{30,45}\b")

              for rel in files:
                  norm = rel.replace("\\", "/")
                  if norm == ".github/workflows/strix_security_audit.yml":
                      continue
                  if os.path.basename(norm) in (".env", ".env.local") or norm.startswith(".env."):
                      red_alerts.append(f"[RED ALERT - ENV FILE COMMITTED] {norm}: tracked environment file must never be committed!")
                      continue
                  with open(rel, "r", encoding="utf-8", errors="ignore") as f:
                      lines = f.read().splitlines()
                  for line_idx, line in enumerate(lines, start=1):
                      for rule_name, rx in api_rules:
                          for m in rx.finditer(line):
                              red_alerts.append(
                                  f"[RED ALERT - {rule_name}] {norm}:{line_idx} -> {mask_secret(m.group(0))}"
                              )
                      for m in aiza_pattern.finditer(line):
                          if not is_firebase_client_context(lines, line_idx - 1):
                              red_alerts.append(
                                  f"[RED ALERT - GEMINI_OR_GOOGLE_AIZA_KEY] {norm}:{line_idx} -> {mask_secret(m.group(0))}"
                              )

          # 1. FULL-REPO API SHIELD SCAN (Gemini / Vercel / Secret Keys)
          all_files = collect_repo_files()
          run_api_shield_scan(all_files)

          # 2. VERCEL ENVIRONMENT VARIABLE COMPLIANCE CHECK (POS V39)
          gateway_path = os.path.join("api", "env-gateway.js")
          if not os.path.exists(gateway_path):
              errors.append("[API SHIELD] Missing Vercel serverless gateway: api/env-gateway.js")
          else:
              gw_src = open(gateway_path, "r", encoding="utf-8", errors="ignore").read()
              if "process.env.GEMINI_API_KEY" not in gw_src or "process.env.VERCEL_API_KEY" not in gw_src:
                  errors.append("[API SHIELD] api/env-gateway.js must read keys strictly from Vercel process.env")
              gw_check = subprocess.run(["node", "--check", gateway_path], capture_output=True, text=True)
              if gw_check.returncode != 0:
                  errors.append(f"[JS SYNTAX BLOCK] api/env-gateway.js: {gw_check.stderr.strip()}")

          # 3. OWASP TOP 10 SINKS SCAN ACROSS HTML / JS / TS SOURCE FILES
          owasp_patterns = {
              "A03_Injection_eval": re.compile(r"\beval\s*\("),
              "A03_Injection_new_Function": re.compile(r"\bnew\s+Function\s*\("),
              "A03_XSS_document_write": re.compile(r"document\.write(?:ln)?\s*\("),
          }
          for rel in all_files:
              if not rel.endswith((".html", ".js", ".mjs", ".cjs", ".jsx", ".ts", ".tsx")):
                  continue
              if "PIPELINE/backups/" in rel.replace("\\", "/"):
                  continue
              with open(rel, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              for rule_name, pattern in owasp_patterns.items():
                  if pattern.search(content):
                      errors.append(f"[OWASP BLOCK] {rel}: detected forbidden sink {rule_name}")

          # 4. POS V39 HTML STRUCTURE, JS SYNTAX, CLIENT KEY GUARD & HTKK v5.7.8 INVARIANTS
          for html_file in ("index.html", "admin.html"):
              if not os.path.exists(html_file):
                  errors.append(f"[MISSING FILE] Required POS V39 file missing: {html_file}")
                  continue
              with open(html_file, "r", encoding="utf-8", errors="ignore") as f:
                  html = f.read()
              lower = html.lower()
              if "</body>" not in lower or "</html>" not in lower:
                  errors.append(f"[STRUCTURAL BLOCK] {html_file}: missing closing </body> or </html> tag")
              if "generativelanguage.googleapis.com" in lower or "api.vercel.com" in lower:
                  red_alerts.append(f"[RED ALERT - DIRECT CLIENT API CALL] {html_file}: must route AI/Vercel API calls via /api/env-gateway (Vercel Env)")

              for idx, match in enumerate(re.finditer(r"<script([^>]*)>([\s\S]*?)</script>", html, re.I)):
                  attrs, body = match.group(1), match.group(2)
                  if not body.strip():
                      continue
                  if "application/ld+json" in attrs.lower():
                      try:
                          json.loads(body)
                      except Exception as exc:
                          errors.append(f"[JSON-LD BLOCK] {html_file} script#{idx}: {exc}")
                      continue
                  with tempfile.NamedTemporaryFile("w", suffix=".mjs", delete=False, encoding="utf-8") as tf:
                      tf.write(body)
                      tmp_path = tf.name
                  res = subprocess.run(["node", "--check", tmp_path], capture_output=True, text=True)
                  os.unlink(tmp_path)
                  if res.returncode != 0:
                      errors.append(f"[JS SYNTAX BLOCK] {html_file} script#{idx}: {res.stderr.strip()}")

              menu_match = re.search(r"const\s+ALL_MENU_DATA\s*=\s*\[(.*?)\];", html, re.S)
              menu_count = len(re.findall(r"\{[^{}]*\bid\s*:", menu_match.group(1))) if menu_match else 0
              if "ALL_MENU_DATA" not in html or menu_count < 110:
                  errors.append(f"[POS INVARIANT BLOCK] {html_file}: ALL_MENU_DATA degraded (count={menu_count})")
              if "3401289271" not in html:
                  errors.append(f"[LEGAL BLOCK] {html_file}: missing MST 3401289271")
              if "shippingFee" not in html and "excludedDriverShippingFee" not in html:
                  errors.append(f"[TAX FLOW BLOCK] {html_file}: missing shippingFee tax exclusion variable")

          if os.path.exists("admin.html"):
              with open("admin.html", "r", encoding="utf-8", errors="ignore") as f:
                  admin_html = f.read()
              if "HTKK" not in admin_html or "5.7.8" not in admin_html:
                  errors.append("[HTKK BLOCK] admin.html: missing HTKK v5.7.8 tax flow")
              if not any(k in admin_html for k in ("hyChayShipperPhone", "acceptOrderByShipper", "computeShipperAccountingMap", "renderShippersTable")):
                  errors.append("[DISPATCH BLOCK] admin.html: shipper synchronization flow broken")

          all_findings = red_alerts + errors
          if all_findings:
              alert_headline = f"STRIX API SHIELD RED ALERT: {len(red_alerts)} leaked API key(s) / {len(errors)} security/HTKK violation(s) detected. Deployment to Vercel BLOCKED."
              print(f"::error title=RED ALERT - API SHIELD BLOCKED::{alert_headline}")
              for item in all_findings:
                  print("BLOCKED:", item)

              summary_file = os.getenv("GITHUB_STEP_SUMMARY")
              if summary_file:
                  with open(summary_file, "a", encoding="utf-8") as sf:
                      sf.write("## 🚨 RED ALERT — BAL V6 API SHIELD & STRIX BLOCKED DEPLOYMENT\n\n")
                      for item in all_findings:
                          sf.write(f"- `{item}`\n")

              if os.getenv("GITHUB_ACTIONS") == "true" and red_alerts:
                  webhook = os.getenv("BAL_RED_ALERT_WEBHOOK", "")
                  if webhook:
                      try:
                          msg = "\n".join(red_alerts[:5])
                          req = urllib.request.Request(
                              webhook,
                              data=msg.encode("utf-8"),
                              headers={
                                  "Title": "RED ALERT: Hard-coded API Key Blocked by Strix",
                                  "Priority": "urgent",
                                  "Tags": "rotating_light,shield"
                              },
                              method="POST"
                          )
                          urllib.request.urlopen(req, timeout=5)
                      except Exception as notify_err:
                          print("RED_ALERT_WEBHOOK_WARN:", notify_err)

              sys.exit(1)

          print(f"PASS: API Shield scanned {len(all_files)} repository files — 0 hard-coded Gemini/Vercel keys, Vercel Env gateway verified, OWASP Top 10 & HTKK v5.7.8 invariants intact.")
          PYEOF

  strix-ai-pentest:
    name: Strix Cloud AI Penetration Test (Zero Local Footprint)
    needs: api-shield-owasp-htkk-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Full Diff History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python for GitHub Cloud Runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Strix Autonomous AI Pentest on Cloud Runner
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "STRIX_NOTICE: LLM_API_KEY secret is not configured in GitHub Repository Secrets yet."
            echo "API Shield + OWASP Top 10 + HTKK Guard executed above. Add LLM_API_KEY & STRIX_LLM in GitHub Secrets for full autonomous LLM pentesting."
            exit 0
          fi

          pipx install strix-agent
          strix -n -t . --instruction "API SHIELD FULL REPO AUDIT: Scan every file across the entire repository for any hard-coded Google Gemini API Key (AIza..., AQ..., GEMINI_API_KEY literals) or Vercel API Key (vcp_..., vcl_..., VERCEL_TOKEN/VERCEL_API_KEY literals). Confirm all POS V39 API calls route via process.env inside Vercel serverless functions (/api/env-gateway.js) rather than exposing client-side keys. Also audit OWASP Top 10 (XSS, DOM injection, auth bypass, IDOR) and verify HTKK v5.7.8 tax calculation, MST 3401289271, ALL_MENU_DATA, and shippingFee exclusion remain intact. Fail non-zero immediately on any finding."
