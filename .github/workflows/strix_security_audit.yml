name: Strix AI Pentest & Security Gate (BAL V6)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: strix-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owasp-htkk-integrity-gate:
    name: OWASP Top 10 & HTKK Tax Flow Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout POS V39 Source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit HTML/JS OWASP Top 10 & HTKK v5.7.8 Integrity
        run: |
          python - <<'PYEOF'
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile

          errors = []

          # 1. Scan HTML/JS/TS source files for high-risk OWASP Top 10 sinks & secret leaks
          owasp_patterns = {
              "A03_Injection_eval": re.compile(r"\beval\s*\("),
              "A03_Injection_new_Function": re.compile(r"\bnew\s+Function\s*\("),
              "A03_XSS_document_write": re.compile(r"document\.write(?:ln)?\s*\("),
              "A02_Secret_PrivateKey": re.compile(r"-----BEGIN (?:RSA|EC|OPENSSH|DSA) PRIVATE KEY-----"),
              "A02_Secret_OpenAIKey": re.compile(r"\bsk-[A-Za-z0-9_-]{20,}"),
              "A02_Secret_GitHubToken": re.compile(r"\bgh[pousr]_[A-Za-z0-9]{20,}"),
              "A02_Secret_AWSKey": re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
          }

          scan_files = []
          for root_file in ("index.html", "admin.html", "pos-dreaming-harness.js", "server.js"):
              if os.path.exists(root_file):
                  scan_files.append(root_file)
          for folder in ("src", "public"):
              if os.path.isdir(folder):
                  for dp, _, fns in os.walk(folder):
                      for fn in fns:
                          if fn.endswith((".html", ".js", ".mjs", ".cjs", ".jsx", ".ts", ".tsx")):
                              scan_files.append(os.path.join(dp, fn))

          for rel in scan_files:
              with open(rel, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              for rule_name, pattern in owasp_patterns.items():
                  if pattern.search(content):
                      errors.append(f"[OWASP BLOCK] {rel}: detected forbidden pattern {rule_name}")

          # 2. Validate HTML structure, JSON-LD, and JavaScript syntax via node --check
          for html_file in ("index.html", "admin.html"):
              if not os.path.exists(html_file):
                  errors.append(f"[MISSING FILE] Required POS V39 file missing: {html_file}")
                  continue
              with open(html_file, "r", encoding="utf-8", errors="ignore") as f:
                  html = f.read()
              lower = html.lower()
              if "</body>" not in lower or "</html>" not in lower:
                  errors.append(f"[STRUCTURAL BLOCK] {html_file}: missing closing </body> or </html> tag")

              for idx, match in enumerate(re.finditer(r"<script([^>]*)>([\s\S]*?)</script>", html, re.I)):
                  attrs, body = match.group(1), match.group(2)
                  if not body.strip():
                      continue
                  if "application/ld+json" in attrs.lower():
                      try:
                          json.loads(body)
                      except Exception as exc:
                          errors.append(f"[JSON-LD BLOCK] {html_file} script#{idx}: {exc}")
                      continue
                  with tempfile.NamedTemporaryFile("w", suffix=".mjs", delete=False, encoding="utf-8") as tf:
                      tf.write(body)
                      tmp_path = tf.name
                  res = subprocess.run(["node", "--check", tmp_path], capture_output=True, text=True)
                  os.unlink(tmp_path)
                  if res.returncode != 0:
                      errors.append(f"[JS SYNTAX BLOCK] {html_file} script#{idx}: {res.stderr.strip()}")

              # 3. Preserve ALL_MENU_DATA (113 base dishes + 9 toppings = 122 menu items invariant)
              menu_match = re.search(r"const\s+ALL_MENU_DATA\s*=\s*\[(.*?)\];", html, re.S)
              menu_count = len(re.findall(r"\{[^{}]*\bid\s*:", menu_match.group(1))) if menu_match else 0
              if "ALL_MENU_DATA" not in html or menu_count < 110:
                  errors.append(f"[POS INVARIANT BLOCK] {html_file}: ALL_MENU_DATA degraded (count={menu_count})")

              # 4. Protect driver shipping fee exclusion & company MST
              if "3401289271" not in html:
                  errors.append(f"[LEGAL BLOCK] {html_file}: missing MST 3401289271")
              if "shippingFee" not in html and "excludedDriverShippingFee" not in html:
                  errors.append(f"[TAX FLOW BLOCK] {html_file}: missing shippingFee tax exclusion variable")

          # 5. Strict HTKK v5.7.8 tax calculation & declaration integrity in admin.html
          if os.path.exists("admin.html"):
              with open("admin.html", "r", encoding="utf-8", errors="ignore") as f:
                  admin_html = f.read()
              if "HTKK" not in admin_html or "5.7.8" not in admin_html:
                  errors.append("[HTKK BLOCK] admin.html: missing HTKK v5.7.8 tax flow")
              if not any(k in admin_html for k in ("hyChayShipperPhone", "acceptOrderByShipper", "computeShipperAccountingMap", "renderShippersTable")):
                  errors.append("[DISPATCH BLOCK] admin.html: shipper synchronization flow broken")

          if errors:
              print("::error::STRIX PRE-DEPLOY SECURITY & HTKK GATE BLOCKED DEPLOYMENT TO VERCEL")
              for err in errors:
                  print("BLOCKED:", err)
              sys.exit(1)

          print("PASS: All OWASP Top 10 static checks, JS syntax checks, ALL_MENU_DATA, and HTKK v5.7.8 invariants verified.")
          PYEOF

  strix-ai-pentest:
    name: Strix Cloud AI Penetration Test (Zero Local Footprint)
    needs: owasp-htkk-integrity-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Full Diff History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python for GitHub Cloud Runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Strix Autonomous AI Pentest on Cloud Runner
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "STRIX_NOTICE: LLM_API_KEY secret is not configured in GitHub Repository Secrets yet."
            echo "To enable deep LLM-driven Strix penetration testing in addition to the deterministic OWASP + HTKK gate,"
            echo "add secrets LLM_API_KEY and STRIX_LLM in GitHub > Settings > Secrets and variables > Actions."
            exit 0
          fi

          pipx install strix-agent
          strix -n -t . --instruction "Audit all HTML and JavaScript files (index.html, admin.html, src/) strictly against OWASP Top 10 (XSS, DOM injection, auth bypass, IDOR, exposed admin secrets) and verify HTKK v5.7.8 tax logic, 3401289271 MST, ALL_MENU_DATA, and shippingFee exclusion remain intact. Fail non-zero on any critical/high issue or broken tax flow."
